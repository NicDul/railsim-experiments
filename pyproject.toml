[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railsim-capacity"
version = "0.1.0"
description = "Scenario editing, single-run analysis and UC1 capacity search for Railsim"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
solver = ["ortools>=9.12"]
llm = ["anthropic"]
plots = ["matplotlib"]

[project.scripts]
railsim-capacity = "railsim_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src/main/python"]
