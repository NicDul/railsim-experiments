[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railsim-mcp"
version = "0.1.0"
description = "Scenario editing, single-run analysis and UC1 capacity search for Railsim"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
solver = ["ortools>=9.12"]
plots = ["matplotlib"]

[project.scripts]
railsim-mcp = "railsim_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src/main/python"]
